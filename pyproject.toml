[project]
name = "ijc-policy-scraper"
version = "0.1.0"
description = "Auditable raw IJC governance document collection"
requires-python = ">=3.12,<3.14"
dependencies = ["scrapy>=2.13,<3", "httpx>=0.28,<1", "PyYAML>=6,<7", "protego>=0.4,<1", "filelock>=3,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
policy-scraper = "policy_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
